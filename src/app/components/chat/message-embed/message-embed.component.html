@switch (renderMode()) {
  @case ('render') {
    @if (safeEmbedUrl(); as src) {
      <iframe
        class="msg-embed__iframe"
        [src]="src"
        loading="lazy"
        sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
      ></iframe>
    }
  }
  @case ('disabled-card') {
    <div class="msg-embed__fallback">
      <a
        class="msg-embed__fallback-link"
        [href]="sourceUrl()"
        target="_blank"
        rel="noopener noreferrer"
        (click)="$event.stopPropagation()"
      >
        <span
          class="msg-embed__fallback-icon"
          [class.msg-embed__fallback-icon--thumb]="previewImageSrc()"
          [style.background]="previewImageSrc() ? null : provider().accentColor"
        >
          @if (previewImageSrc(); as thumb) {
            <img [src]="thumb" alt="" class="msg-embed__fallback-thumb-img" loading="lazy" />
            <span class="msg-embed__fallback-badge" [style.background]="provider().accentColor">
              <ion-icon [name]="provider().icon"></ion-icon>
            </span>
          } @else {
            <ion-icon [name]="provider().icon"></ion-icon>
          }
        </span>
        <span class="msg-embed__fallback-body">
          <span class="msg-embed__fallback-label">{{ previewTitle() ?? provider().label }}</span>
          <span class="msg-embed__fallback-url">{{ hostnameOf(sourceUrl()) }}</span>
        </span>
        <ion-icon name="open-outline" class="msg-embed__fallback-open"></ion-icon>
      </a>
      @if (showOverrideActions()) {
        <div class="msg-embed__fallback-actions">
          <button
            type="button"
            class="msg-embed__btn msg-embed__btn--primary"
            [style.background]="provider().accentColor"
            [style.border-color]="provider().accentColor"
            (click)="alwaysAllow()"
          >
            {{ 'embed.fallback.always_allow' | translate: { provider: provider().label } }}
          </button>
          <button type="button" class="msg-embed__btn msg-embed__btn--ghost" (click)="loadOnce()">
            {{ 'embed.fallback.load_once' | translate }}
          </button>
        </div>
      }
    </div>
  }
}
